<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌏 국제 무역 연습장</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#19304d;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 14px 60px}.hero{background:linear-gradient(115deg,#12386e,#2585b9);color:white;padding:27px;border-radius:18px;text-align:center}.hero h1{margin:0;font-size:29px}.hero p{margin:8px 0 0;opacity:.92}.card{background:white;border:1px solid #dce5ef;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #173c6c09}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:10px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#fff;color:#254362;border:1px solid #cbd9e8;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}button:hover{background:#edf5ff}button.primary,button.active{background:#1f63a8;color:white;border-color:#1f63a8}button.selected{background:#dceeff;color:#12447d;border:2px solid #2075c4}button:disabled{opacity:.4;cursor:not-allowed}.muted{color:#65758a;font-size:13px;line-height:1.6}.lead{font-size:19px;line-height:1.65;font-weight:700}.story{background:#f2f6fc;border-radius:12px;padding:18px;line-height:1.9;font-size:16px}.notice{background:#fff4d7;border:1px solid #e5bd60;border-radius:11px;padding:14px;text-align:center;margin:15px 0;color:#765014}.notice strong{display:block;font-size:18px;margin:4px 0}table{width:100%;border-collapse:collapse;margin:12px 0;text-align:center}th,td{border:1px solid #d6e0eb;padding:10px 5px}th{background:#eaf1f9}td{background:#fff}input{width:92px;max-width:100%;border:1px solid #b9c9db;border-radius:8px;padding:10px;font-size:16px;text-align:center}input:focus{outline:2px solid #76b7f6}.small{font-size:12px;color:#65758a;line-height:1.4;font-weight:400}.q{padding:12px 0;border-bottom:1px solid #e8eef5}.q label{font-weight:700;display:block;margin-bottom:9px}.unit{color:#65758a;font-size:13px;margin-left:5px}.ok{color:#11834a;font-weight:800}.bad{color:#bd3b43;font-weight:800}.help{background:#f0f5fb;border-radius:10px;padding:14px;margin-top:12px;line-height:1.75}.help p{margin:8px 0}.range{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:15px 0;font-weight:750;font-size:19px}.range input{width:110px}.range span.middle{text-align:center;font-size:16px}.progress{background:#e9eef5;height:10px;border-radius:10px;overflow:hidden;margin:13px 0}.progress span{background:#2788bf;height:100%;display:block;width:0}.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.bar{background:#e9eef5;height:15px;border-radius:10px;overflow:hidden;margin:6px 0 12px}.bar span{background:#2478bf;height:100%;display:block}.bar.after span{background:#e4a04d}.pill{font-size:12px;color:#2866a1;background:#e7f1fd;border-radius:8px;padding:5px 8px;margin-right:6px}.foot{text-align:center;color:#718096;font-size:12px;margin-top:25px}@media(max-width:500px){.wrap{padding:10px 8px 35px}.card{padding:13px}.hero h1{font-size:24px}.lead{font-size:17px}th,td{padding:8px 3px}input{width:68px;padding:8px 3px;font-size:14px}.range input{width:76px}.range{gap:5px;font-size:16px}.range span.middle{font-size:13px}}
</style></head><body><main class="wrap"><header class="hero"><h1>🌏 국제 무역 연습장</h1><p>절대우위 · 비교우위 · 특화와 교역조건</p></header><section class="card"><b>학습 단계 선택</b><div id="tabs" class="buttons"></div><div id="description" class="muted"></div><div class="buttons"><button id="new">🎲 새 문제 만들기</button><button id="reset">↻ 이 단계 다시 풀기</button><button id="all">전체 풀이 보기</button></div><div class="progress"><span id="progress"></span></div><div id="score" class="muted"></div></section><section class="card" id="problem"></section><div id="steps"></div><section class="card" id="visual" hidden></section><div class="foot">통합사회2 · 국제 무역 학습 활동</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),N=['갑국','을국'],G=[['커피','초콜릿'],['사과','바나나'],['신발','가방'],['쌀','밀'],['자동차','옷']],CU=[['잔','개'],['개','개'],['켤레','개'],['포대','포대'],['대','벌']],U=[['달러','생산비'],['시간','노동시간'],['명','노동자 수']];let level=1,states={};const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,gcd=(a,b)=>b?gcd(b,a%b):a,frac=(a,b)=>{let d=gcd(a,b);return b/d===1?String(a/d):`${a/d}/${b/d}`},fmt=x=>Number.isInteger(x)?String(x):String(+x.toFixed(5)),parse=x=>{x=String(x??'').trim();if(!x)return NaN;if(/^\d+\s*\/\s*\d+$/.test(x)){let[a,b]=x.split('/').map(Number);return b?a/b:NaN}return Number(x)},equal=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-5;
function make(l,prev){let c;if(l===1){let a=rnd(2,6),b=a,x=rnd(1,4),y=rnd(1,4);c=[[a,b+x],[a+y,b]];/* Each country's other-good cost exceeds its specialized-good cost, guaranteeing positive savings. */if(Math.random()<.5)c.reverse()}else if(l===2){let a=rnd(2,4),b=a+rnd(1,3),d=b+rnd(1,3),z=d+rnd(1,3);c=[[a,b],[z,d]]}else{let patterns=[[[3,4],[6,5]],[[4,5],[7,6]],[[5,6],[9,7]],[[3,5],[7,6]],[[4,7],[8,6]],[[5,8],[9,7]]];c=JSON.parse(JSON.stringify(patterns[rnd(0,patterns.length-1)]))}if(l>1){if(Math.random()<.5)c.reverse();if(Math.random()<.5)c=c.map(r=>[r[1],r[0]]);let x=c[0][0]/c[0][1],y=c[1][0]/c[1][1];if(!(Math.min(x,y)<1&&1<Math.max(x,y))){c=l===2?[[2,3],[5,4]]:[[3,4],[6,5]];if(Math.random()<.5)c.reverse();if(Math.random()<.5)c=c.map(r=>[r[1],r[0]])}}else if(Math.random()<.5)c=c.map(r=>[r[1],r[0]]);return{c,gi:rnd(0,G.length-1),ui:l===3?((prev?.ui??-1)+1)%3:rnd(0,2),answers:{},checks:{},hints:{},solutions:{}}}
const state=()=>states[level]||(states[level]=make(level));function spec(s,i){let c=s.c;return level===1?(c[i][0]<c[1-i][0]?0:1):(c[i][0]/c[i][1]<c[1-i][0]/c[1-i][1]?0:1)}
function titles(){return level===1?['절대우위 판단','특화 후 무역 후 각국의 이익']:level===2?['기회비용 계산','비교우위 및 특화 판단','특화 후 무역 후 각국의 이익','이익을 얻는 교환비율']:['자료를 표로 정리하기','기회비용 계산','비교우위 및 특화 판단','특화 후 무역 후 각국의 이익','이익을 얻는 교환비율']}
function questions(){let s=state(),c=s.c,g=G[s.gi],cu=CU[s.gi],u=U[s.ui][0],q=[];const add=(step,id,label,val,why,type='num',opts=[],unit='')=>q.push({step,id,label,val,why,type,opts,unit});if(level===1){for(let j=0;j<2;j++){let w=c[0][j]<c[1][j]?0:1;add(1,'a'+j,g[j]+'의 절대우위 국가',N[w],`${N[w]}의 단위 생산요소 투입량이 더 적습니다.`,'choice',N)}}else{if(level===3)for(let i=0;i<2;i++)for(let j=0;j<2;j++)add(1,'d'+i+j,N[i]+'의 '+g[j]+' 생산요소',c[i][j],`${c[i][j]}${u}`,'num',[],u);let ocstep=level===3?2:1;for(let i=0;i<2;i++)for(let j=0;j<2;j++)add(ocstep,'oc'+i+j,N[i]+'의 '+g[j]+' 기회비용',c[i][j]/c[i][1-j],`${c[i][j]} ÷ ${c[i][1-j]} = ${frac(c[i][j],c[i][1-j])} ${g[1-j]} ${cu[1-j]}`,'num',[],cu[1-j]);let cs=ocstep+1;for(let j=0;j<2;j++){let w=c[0][j]/c[0][1-j]<c[1][j]/c[1][1-j]?0:1;add(cs,'ca'+j,g[j]+'의 비교우위 국가',N[w],`${N[w]}의 ${g[j]} 기회비용이 더 낮습니다.`,'choice',N)}for(let i=0;i<2;i++)add(cs,'sp'+i,N[i]+'의 특화 재화',g[spec(s,i)],`${N[i]}은 ${g[spec(s,i)]}에 특화합니다.`,'choice',g)}let gs=level===1?2:level===2?3:4;for(let i=0;i<2;i++){let j=spec(s,i),before=c[i][0]+c[i][1],after=2*c[i][j],v=before-after;add(gs,'gain'+i,N[i]+'의 생산요소 절약 또는 손해',v,`특화 전 ${before}${u} − 특화 후 ${after}${u} = ${v}${u}. ${v>=0?'이익(절약)':'손해'}입니다.`,'signed',[],u);if(level===3)add(gs,'extra'+i,N[i]+'이 절약한 생산요소로 추가 생산 가능한 '+g[j]+'의 수',v/c[i][j],`${v}${u} ÷ ${c[i][j]}${u} = ${frac(v,c[i][j])}${cu[j]}`,'num',[],cu[j])}if(level>1){let ts=level===2?4:5,lo=Math.min(c[0][0]/c[0][1],c[1][0]/c[1][1]),hi=Math.max(c[0][0]/c[0][1],c[1][0]/c[1][1]);add(ts,'lo','교환비율 하한',lo,`X재 1단위의 기회비용 중 작은 값 ${fmt(lo)}가 하한입니다.`,'num',[],cu[1]);add(ts,'hi','교환비율 상한',hi,`큰 값 ${fmt(hi)}가 상한입니다. 양국 모두 이익을 얻으려면 양 끝값을 제외합니다.`,'num',[],cu[1])}return q}
function mark(x,s){if(!(x.id in s.checks))return '';let v=s.checks[x.id];return `<span class="${v===true?'ok':'bad'}">${v===null?' 미입력':v?' ✓':' ✗'}</span>`}function field(x,s){if(x.type==='choice')return `<div class="buttons">${x.opts.map(o=>`<button data-choice="${x.id}" data-value="${o}" class="${s.answers[x.id]===o?'selected':''}">${o}</button>`).join('')}</div>`;if(x.type==='signed')return `<div class="buttons">${['이익(절약)','손해'].map(o=>`<button data-sign="${x.id}" data-value="${o}" class="${(s.answers[x.id+'sign']??'이익(절약)')===o?'selected':''}">${o}</button>`).join('')}<input data-input="${x.id}" value="${s.answers[x.id]??''}" placeholder="숫자"><span class="unit">${x.unit}</span></div>`;return `<input data-input="${x.id}" value="${s.answers[x.id]??''}" placeholder="숫자/분수"><span class="unit">${x.unit}</span>`}
function draw(){let s=state(),c=s.c,g=G[s.gi],cu=CU[s.gi],u=U[s.ui][0],un=U[s.ui][1],q=questions(),ts=titles(),gainStep=level===1?2:level===2?3:4,tradeStep=level===2?4:5;$('tabs').innerHTML=[1,2,3].map(i=>`<button data-level="${i}" class="${i===level?'active':''}">${i}단계</button>`).join('');$('description').textContent=level===1?'절대우위 기초':level===2?'비교우위와 교환비율': '문장형 자료 분석 · 비교우위 심화';let table=`<table><tr><th>구분</th><th>${g[0]}</th><th>${g[1]}</th></tr>${c.map((row,i)=>`<tr><th>${N[i]}</th><td>${row[0]}${u}</td><td>${row[1]}${u}</td></tr>`).join('')}</table>`,story=`<div class="story">${N.map((n,i)=>`${n}은 ${g[0]} 1${cu[0]}를 생산하는 데 ${c[i][0]}${u}이 필요하고, ${g[1]} 1${cu[1]}를 생산하는 데 ${c[i][1]}${u}이 필요합니다.`).join('<p></p>')}</div>`;$('problem').innerHTML=`<h2>📘 ${level}단계 문제</h2><div class="${level===1?'lead':'muted'}">다음은 두 나라에서 재화 한 단위를 생산하는 데 필요한 <b>${un}(${u})</b>입니다.</div>${level===3?story:table}<div class="notice"><div>📌 교역 전 생산 조건</div><strong>각국은 ${g[0]} 1${cu[0]}, ${g[1]} 1${cu[1]}씩 생산</strong></div>`;
$('steps').innerHTML=ts.map((title,k)=>{let step=k+1,qs=q.filter(x=>x.step===step),fields='';if(level===3&&step===1){fields=`<p class="muted">문장 자료를 읽고 생산요소 표를 완성하세요.</p><table><tr><th>구분</th><th>${g[0]}</th><th>${g[1]}</th></tr>${[0,1].map(i=>`<tr><th>${N[i]}</th>${[0,1].map(j=>{let x=qs.find(v=>v.id==='d'+i+j);return `<td><input data-input="${x.id}" value="${s.answers[x.id]??''}" aria-label="${x.label}"><span class="unit">${u}</span>${mark(x,s)}</td>`}).join('')}</tr>`).join('')}</table>`}else if(level>1&&step===(level===2?1:2)){fields=`<p class="muted">기회비용을 숫자 또는 분수로 입력하세요.</p><table><tr><th>구분</th><th>X재<div class="small">${g[0]} 1${cu[0]}당 포기하는 ${g[1]}의 수</div></th><th>Y재<div class="small">${g[1]} 1${cu[1]}당 포기하는 ${g[0]}의 수</div></th></tr>${[0,1].map(i=>`<tr><th>${N[i]}</th>${[0,1].map(j=>{let x=qs.find(v=>v.id==='oc'+i+j);return `<td><input data-input="${x.id}" value="${s.answers[x.id]??''}" aria-label="${x.label}"><span class="unit">${x.unit}</span>${mark(x,s)}</td>`}).join('')}</tr>`).join('')}</table>`}else if(step===tradeStep&&level>1){let a=qs.find(x=>x.id==='lo'),b=qs.find(x=>x.id==='hi');fields=`<p>양국이 모두 이익을 얻는 교환비율의 범위를 구하세요.</p><div class="range"><input data-input="lo" value="${s.answers.lo??''}" aria-label="하한"><span>&lt;</span><span class="middle">X재 1개당 Y재 수<br><span class="small">(${g[0]} 1${cu[0]}당 ${g[1]}의 수)</span></span><span>&lt;</span><input data-input="hi" value="${s.answers.hi??''}" aria-label="상한"></div><div class="muted" style="text-align:center">입력값의 단위: ${cu[1]} ${mark(a,s)} ${mark(b,s)}</div>`}else fields=qs.map(x=>`<div class="q"><label>${x.label}</label>${field(x,s)}${mark(x,s)}</div>`).join('');if(step===gainStep)fields=`<div class="notice"><div style="font-size:17px;font-weight:800">🤝 교환비율 1 : 1</div><strong>${g[0]} 1${cu[0]} ↔ ${g[1]} 1${cu[1]}</strong><div class="small" style="color:#765014">각국은 특화 재화 2단위를 생산한 후, 그중 1단위를 서로 교환합니다.</div></div>`+fields;let done=qs.every(x=>x.id in s.checks);let hint=step===gainStep?`특화 전에는 두 재화 각각 1단위씩 생산합니다. 특화 후에는 ${level===1?'절대우위':'비교우위'} 재화만 2단위 생산합니다. 투입량 차이를 계산하세요.`:step===tradeStep?'두 나라의 X재 기회비용 사이가 교환비율의 범위입니다. 양 끝값은 제외합니다.':title.includes('기회비용')?'기회비용 = 해당 재화의 단위 생산비 ÷ 다른 재화의 단위 생산비':title.includes('우위')?'절대우위는 생산요소 투입량이 더 적은 나라, 비교우위는 기회비용이 더 작은 나라입니다.':'문장 속 수치를 국가와 재화에 맞춰 옮겨 적으세요.';return `<section class="card"><h2><span class="pill">STEP ${step}</span>${title}</h2>${fields}<div class="buttons"><button class="primary" data-check="${step}">정답 확인</button><button data-hint="${step}">힌트 보기</button><button data-solution="${step}" ${done?'':'disabled'}>풀이 보기</button></div>${s.hints[step]?`<div class="help">💡 ${hint}</div>`:''}${s.solutions[step]&&done?`<div class="help">${qs.map(x=>`<p><b>${x.label}</b><br><span class="ok">정답: ${x.type==='signed'?(x.val>=0?'이익(절약) ':'손해 ')+fmt(Math.abs(x.val)):typeof x.val==='number'?fmt(x.val):x.val} ${x.unit}</span><br>${x.why}</p>`).join('')}</div>`:''}</section>`}).join('');let checked=q.filter(x=>x.id in s.checks).length,correct=q.filter(x=>s.checks[x.id]===true).length,complete=checked===q.length;$('progress').style.width=100*checked/q.length+'%';$('score').textContent=`채점 ${checked}/${q.length}문항 · 정답 ${correct}개 · 정답률 ${checked?Math.round(100*correct/checked):0}%`;$('visual').hidden=!complete;if(complete)$('visual').innerHTML=`<h2>📊 눈으로 확인하는 학습</h2><div class="bars">${[0,1].map(i=>{let j=spec(s,i),a=c[i][0]+c[i][1],b=2*c[i][j],m=Math.max(a,b);return `<div class="card"><b>${N[i]} · ${g[j]} 특화</b><p class="muted">특화 전 ${a}${u}</p><div class="bar"><span style="width:${100*a/m}%"></span></div><p class="muted">특화 후 ${b}${u}</p><div class="bar after"><span style="width:${100*b/m}%"></span></div><b class="${a>=b?'ok':'bad'}">${a>=b?'이익(절약)':'손해'} ${Math.abs(a-b)}${u}</b></div>`}).join('')}</div>${level>1?`<div class="help"><b>양국 모두 이익을 얻는 교환비율</b><p>${fmt(Math.min(c[0][0]/c[0][1],c[1][0]/c[1][1]))} &lt; ${g[0]} 1${cu[0]}당 ${g[1]}의 수 &lt; ${fmt(Math.max(c[0][0]/c[0][1],c[1][0]/c[1][1]))}</p></div>`:''}<p class="muted">이 그래프는 생산요소 투입량의 변화를 보여 줍니다. 실제 교역 후 소비 이익과는 구분해야 합니다.</p>`;
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;draw()});document.querySelectorAll('[data-input]').forEach(b=>b.oninput=()=>{let id=b.dataset.input;s.answers[id]=b.value;delete s.checks[id]});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.answers[b.dataset.choice]=b.dataset.value;delete s.checks[b.dataset.choice];draw()});document.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{s.answers[b.dataset.sign+'sign']=b.dataset.value;delete s.checks[b.dataset.sign];draw()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{questions().filter(x=>x.step===+b.dataset.check).forEach(x=>{let v=s.answers[x.id]??'',n=parse(v);s.checks[x.id]=v===''?null:x.type==='choice'?v===x.val:x.type==='signed'?equal(n,Math.abs(x.val))&&(s.answers[x.id+'sign']??'이익(절약)')===(x.val>=0?'이익(절약)':'손해'):equal(n,x.val)});draw()});document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{let k=b.dataset.hint;s.hints[k]=!s.hints[k];draw()});document.querySelectorAll('[data-solution]').forEach(b=>b.onclick=()=>{let k=+b.dataset.solution;if(!questions().filter(x=>x.step===k).every(x=>x.id in s.checks))return;s.solutions[k]=!s.solutions[k];draw()});save()}
function save(){try{localStorage.setItem('trade_practice_final_v1',JSON.stringify({level,states}))}catch(e){}}$('new').onclick=()=>{states[level]=make(level,states[level]);draw()};$('reset').onclick=()=>{let s=state();s.answers={};s.checks={};s.hints={};s.solutions={};draw()};$('all').onclick=()=>{let s=state();if(!questions().every(x=>x.id in s.checks)){alert('모든 STEP에서 정답 확인을 먼저 완료하세요.');return}for(let i=1;i<=titles().length;i++)s.solutions[i]=true;draw()};try{let saved=JSON.parse(localStorage.getItem('trade_practice_final_v1'));if(saved&&[1,2,3].includes(saved.level)&&saved.states){level=saved.level;states=saved.states}}catch(e){}draw();})();
</script></body></html>
